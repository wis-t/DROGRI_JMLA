<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | متجري+</title><link rel="stylesheet" href="style.css"></head>
<body class="adminBody"><header class="top"><div class="container nav"><a class="logo" href="index.html">متجري<span>+</span></a><strong>لوحة الإدارة</strong><a href="index.html">عرض المتجر</a></div></header>
<main class="container admin">
<section class="panel"><h1>إضافة منتج</h1><p class="muted">أضف المنتجات من هنا بدون تعديل ملفات الموقع.</p>
<form id="productForm">
<input id="name" required placeholder="اسم المنتج"><input id="price" type="number" step="0.01" required placeholder="السعر"><input id="oldPrice" type="number" step="0.01" placeholder="السعر القديم (اختياري)">
<input id="category" required placeholder="القسم"><input id="image" placeholder="رابط صورة المنتج (اختياري)"><textarea id="description" placeholder="وصف المنتج"></textarea>
<button class="btn" type="submit">إضافة المنتج</button></form></section>
<section class="panel"><div class="sectionHead"><h2>المنتجات الحالية</h2><button class="danger" onclick="resetProducts()">استعادة المنتجات التجريبية</button></div><div id="adminProducts"></div></section>
</main><script src="app.js"></script></body></html>
